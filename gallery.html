*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:18px/1.5 "Futura PT",Jost,Futura,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 40px}

.hh-foot{margin-top:40px;padding-top:12px;border-top:1px solid var(--line);color:#8a8f98;font-size:13px;line-height:1.5}
@media (max-width:600px){body{font-size:17px}h1{font-size:28px}.grid{grid-template-columns:1fr}}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gal figure{margin:0}.gal a.th{display:block;aspect-ratio:4/3;background:#000;border:1px solid var(--line)}
.gal a.th:hover,.gal a.th:focus{border-color:var(--acc);outline:none}.gal img{display:block;width:100%;height:100%;object-fit:cover}
.gal video{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#000;border:1px solid var(--line)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;z-index:9;align-items:center;justify-content:center;flex-direction:column}
